<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bcast Studio</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#3DDC97"/><rect x="3.4" y="8" width="10.2" height="3.4" rx=".9" fill="#0B2418"/><rect x="8.6" y="13" width="12" height="3.4" rx=".9" fill="#0B2418"/><rect x="14.1" y="6.6" width="1.8" height="13" rx=".9" fill="#FFFFFF"/><path d="M12.4 4.4h5.2L15 7.4z" fill="#FFFFFF"/></svg>
        </span>
        <span class="brand-name">bcast Studio</span>
      </div>
      <nav class="modes" role="tablist" aria-label="Çalışma yeri">
        <button class="mode active" data-view="local" id="navLocal" role="tab" type="button"></button>
        <button class="mode" data-view="servers" id="navServers" role="tab" type="button"></button>
      </nav>
      <div class="titlebar-fill"></div>
      <div id="ffPill" class="ff-pill no-drag"></div>
    </header>

    <main class="main">
      <section class="view" id="view-local">
        <div id="ffBanner"></div>
        <div class="local-grid">
          <div class="col">
            <div class="card" id="sourcesCard"></div>
            <div class="card" id="optionsCard"></div>
            <div class="card" id="jobsCard"></div>
          </div>
          <aside class="col side">
            <div class="card presets-card" id="presetsCard"></div>
            <div class="actionbar" id="actionBar"></div>
          </aside>
        </div>
      </section>

      <section class="view hidden" id="view-servers">
        <div class="servers-grid">
          <div class="card server-list" id="serverList"></div>
          <div class="server-detail" id="serverDetail"></div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <div class="sb-left" id="statusLeft"></div>
      <div class="sb-right" id="statusRight"></div>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="dropVeil" class="drop-veil"><div>Bırakın, kaynaklara eklensin</div></div>
  <script src="app.js"></script>
</body>
</html>
