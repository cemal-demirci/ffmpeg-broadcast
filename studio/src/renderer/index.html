<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bcast Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6.5" fill="currentColor"/><g fill="none" stroke="#0B2418" stroke-width="2.3" stroke-linecap="round"><path d="M7.6 10.4a6 6 0 0 1 6 6"/><path d="M7.6 5.6a10.8 10.8 0 0 1 10.8 10.8"/></g><circle cx="8.2" cy="15.8" r="2.1" fill="#0B2418"/></svg>
        </span>
        <span class="brand-name">bcast <b>Studio</b></span>
        <span class="brand-by">Cemal.cloud</span>
      </div>
      <div class="titlebar-fill"></div>
      <div id="ffPill" class="ff-pill no-drag"></div>
    </header>

    <div class="body">
      <nav class="sidebar" id="sidebar">
        <button class="nav-item active" data-view="local" id="navLocal"></button>
        <button class="nav-item" data-view="servers" id="navServers"></button>
        <div class="nav-activity" id="navActivity"></div>
        <div class="sidebar-foot" id="sidebarFoot"></div>
      </nav>

      <main class="main">
        <section class="view" id="view-local">
          <div id="ffBanner"></div>
          <div class="local-grid">
            <div class="col">
              <div class="card" id="sourcesCard"></div>
              <div class="card" id="optionsCard"></div>
              <div class="card" id="jobsCard"></div>
            </div>
            <aside class="col side">
              <div class="card presets-card" id="presetsCard"></div>
              <div class="actionbar" id="actionBar"></div>
            </aside>
          </div>
        </section>

        <section class="view hidden" id="view-servers">
          <div class="servers-grid">
            <div class="server-list" id="serverList"></div>
            <div class="server-detail" id="serverDetail"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="dropVeil" class="drop-veil"><div>Bırakın, kaynaklara eklensin</div></div>
  <script src="app.js"></script>
</body>
</html>
